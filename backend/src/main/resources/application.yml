spring:
  application:
    name: meetly-api
  datasource:
    url: jdbc:postgresql://localhost:5432/meetly
    username: meetly
    password: meetly
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

meetly:
  auth:
    jwt-secret: meetly_dev_jwt_secret_min_32_chars_0123
    access-ttl: 15m
    refresh-ttl: 14d
    cookie-secure: false
  livekit:
    api-key: devkey
    api-secret: meetly_dev_secret_0123456789abcdef
    ws-url: ws://localhost:7880
    http-url: http://localhost:7880
  storage:
    endpoint: http://localhost:9000        # presign target — reached by the browser on the host
    upload-endpoint: http://localhost:9000 # egress (network_mode host) uploads via the published port
    region: us-east-1
    bucket: meetly-recordings
    access-key: minio
    secret-key: minio12345
  cors:
    allowed-origins: http://localhost:5173
