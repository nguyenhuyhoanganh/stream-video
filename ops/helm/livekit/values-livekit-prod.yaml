replicaCount: 2

livekit:
  port: 7880
  rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    use_external_ip: true
  redis:
    address: "CHANGEME-redis-host:6379"   # managed redis, shared with egress
  # keys: inject khi install:
  #   --set livekit.keys.<API_KEY>=<API_SECRET>
  turn:
    enabled: false   # a standalone coturn is used instead (Task 9)
  prometheus:
    port: 6789

nodeSelector:
  role: livekit
tolerations:
  - key: dedicated
    value: livekit
    effect: NoSchedule

# hostNetwork so UDP goes straight to the node public IP
hostNetwork: true

loadBalancer:
  type: disable   # media bypasses the LB; only ws signalling goes through its own ingress
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: livekit.meetly.example.com
      paths: ["/"]
  tls:
    - secretName: livekit-tls
      hosts: [livekit.meetly.example.com]
