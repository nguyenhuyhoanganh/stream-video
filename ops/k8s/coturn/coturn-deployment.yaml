apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: livekit
spec:
  replicas: 1
  selector:
    matchLabels: { app: coturn }
  template:
    metadata:
      labels: { app: coturn }
    spec:
      # KHÔNG hostNetwork: public traffic đi qua Service LoadBalancer bên dưới
      nodeSelector: { role: livekit }
      containers:
        - name: coturn
          image: coturn/coturn:4.6-alpine
          args:
            - -c
            - /etc/coturn/turnserver.conf
            - --static-auth-secret=$(TURN_SECRET)
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef: { name: coturn-secret, key: static-auth-secret }
          volumeMounts:
            - { name: config, mountPath: /etc/coturn }
            - { name: certs, mountPath: /certs }
      volumes:
        - name: config
          configMap: { name: coturn-config }
        - name: certs
          secret: { secretName: turn-tls }   # cert-manager Certificate cho turn.meetly.example.com
