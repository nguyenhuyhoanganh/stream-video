name: meetly-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetly
      POSTGRES_USER: meetly
      POSTGRES_PASSWORD: meetly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9.1
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    depends_on: [redis]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50060:50000-50060/udp"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb -p local/meetly-recordings || true
      "

  egress:
    image: livekit/egress:v1.9
    depends_on: [redis, livekit]
    # host network so chromium inside egress can reach the ICE 127.0.0.1 that livekit
    # (--node-ip 127.0.0.1) advertises, and so it can reach minio on localhost:9000
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    # egress needs a large shm to run the chromium compositor
    shm_size: 2gb

volumes:
  pgdata:
  miniodata:
