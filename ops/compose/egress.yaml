api_key: devkey
api_secret: meetly_dev_secret_0123456789abcdef
# egress runs with network_mode: host and reaches LiveKit/Redis via published ports
# (livekit --node-ip 127.0.0.1 advertises ICE 127.0.0.1, unreachable from a bridge container)
ws_url: ws://localhost:7880
redis:
  address: localhost:6379
insecure: true
logging:
  level: info
